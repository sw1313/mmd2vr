x-paths: &paths
  MMD_LTX25_HOME: /models/ltx25
  MMD_INPUT_ALIASES: "${MMD_INPUT_ALIASES:-}"
  MMD_OUTPUT_ALIASES: "${MMD_OUTPUT_ALIASES:-}"

x-app: &app
  environment: *paths
  user: "${MMD_UID:-1000}:${MMD_GID:-1000}"
  restart: unless-stopped
  init: true
  volumes:
    - "${MMD_INPUT_HOST:-./input}:/input:ro"
    - "${MMD_OUTPUT_HOST:-./output}:/output"
    - "${MMD_STATE_HOST:-./state}:/state"
    - "${MMD_MODELS_HOST:-./models}:/models"

services:
  web:
    <<: *app
    image: mmd2vr-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${MMD_BIND_IP:-127.0.0.1}:${MMD_PORT:-7860}:7860"
  worker:
    <<: *app
    image: mmd2vr-worker:local
    build: .
    runtime: nvidia
    environment:
      <<: *paths
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
